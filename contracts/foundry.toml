# Set Chain Foundry Configuration
[profile.default]
src = "."
out = "out_ar"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
skip = [
    "lib/**/certora/**",
    "lib/**/test/**",
    "lib/**/lib/**",
]

# Explicit remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Solidity compiler settings
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 100
via_ir = true

[profile.default.optimizer_details]
yul = true

[profile.default.optimizer_details.yul_details]
stack_allocation = true
optimizer_steps = "dhfoDgvulfnTUtnIf"

# EVM settings
evm_version = "cancun"

# Testing
verbosity = 3
fuzz = { runs = 256, max_test_rejects = 65536 }
invariant = { runs = 256, depth = 15 }

# Gas reporting
gas_reports = ["SetRegistry", "SetPaymaster", "SetPaymentBatch", "SetTimelock", "SequencerAttestation", "ForcedInclusion", "EncryptedMempool", "ThresholdKeyRegistry", "SSDC", "NAVOracle", "TreasuryVault", "TokenRegistry"]

# Faster local/targeted profile. The contracts require via-IR, so sparse mode
# avoids compiling unrelated sources while preserving release-equivalent codegen.
[profile.fast]
via_ir = true
optimizer_runs = 50
sparse_mode = true
fuzz = { runs = 64, max_test_rejects = 4096 }
invariant = { runs = 64, depth = 10 }

# Production-equivalent code generation with dependency-graph-only compilation
# for local deployment scripts. Unlike `fast`, this inherits optimizer_runs=100.
[profile.devnet]
src = "script"
test = "script"
script = "script"
sparse_mode = true

# Coverage is deliberately rooted in release-critical contracts. The default
# source root contains scripts and broad demo surfaces whose coverage-specific
# minimal-IR instrumentation exceeds the Solidity compiler's Yul stack limit.
[profile.coverage_registry]
src = "coverage-src/registry"
test = "coverage-test/registry"
via_ir = true
sparse_mode = true
fuzz = { runs = 64, max_test_rejects = 4096 }
invariant = { runs = 64, depth = 10 }

[profile.coverage_escrow]
src = "coverage-src/escrow"
test = "coverage-test/escrow"
via_ir = true
sparse_mode = true
fuzz = { runs = 64, max_test_rejects = 4096 }
invariant = { runs = 64, depth = 10 }

[profile.coverage_fx]
src = "coverage-src/fx"
test = "coverage-test/fx"
via_ir = true
sparse_mode = true
fuzz = { runs = 64, max_test_rejects = 4096 }
invariant = { runs = 64, depth = 10 }

[profile.coverage_reserves]
src = "coverage-src/reserves"
test = "coverage-test/reserves"
via_ir = true
sparse_mode = true
fuzz = { runs = 64, max_test_rejects = 4096 }
invariant = { runs = 64, depth = 10 }

# Autoresearch benchmark profile — via-IR required, focused gas reporting
[profile.bench]
via_ir = true
optimizer = true
optimizer_runs = 200
fuzz = { runs = 64, max_test_rejects = 4096 }
invariant = { runs = 64, depth = 10 }
gas_reports = ["SetRegistry", "SetPaymaster", "SetPaymentBatch"]

# Formatter
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
