# Set Chain - Simple Local Development
# Runs a standalone L2 execution client for testing, NOT a complete rollup.
# Isolated project resources; legacy global volumes are not migrated or deleted.

name: set-local-execution

services:
  # =========================================================================
  # op-geth Initialization (runs once)
  # =========================================================================
  op-geth-init:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101411.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -f /data/geth/chaindata/CURRENT ]; then
          echo "Initializing op-geth with genesis..."
          geth init --datadir=/data --state.scheme=hash /config/genesis.json
          echo "Initialization complete"
        else
          echo "Already initialized, skipping"
        fi
    volumes:
      - op-geth-data:/data
      - ./config:/config:ro

  # =========================================================================
  # op-geth - L2 Execution Client
  # =========================================================================
  op-geth:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101411.2
    command:
      - --datadir=/data
      - --networkid=${L2_CHAIN_ID:-84532001}
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8547
      - --http.api=eth,net,web3
      - --http.vhosts=localhost,127.0.0.1,op-geth
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8548
      - --ws.api=eth,net,web3
      - --ws.origins=http://localhost,http://127.0.0.1
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/config/jwt.txt
      - --authrpc.vhosts=localhost,127.0.0.1,op-geth
      - --nodiscover
      - --maxpeers=0
      - --syncmode=full
      - --gcmode=archive
      - --verbosity=3
      - --rollup.sequencerhttp=
      - --rollup.disabletxpoolgossip=true
    volumes:
      - op-geth-data:/data
      - ./config:/config:ro
    ports:
      - "127.0.0.1:8547:8547"   # Local HTTP RPC
      - "127.0.0.1:8548:8548"   # Local WebSocket
      # Authenticated Engine RPC is not published to the host.
    depends_on:
      op-geth-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8547"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  op-geth-data:

networks:
  default:
