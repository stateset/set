name: Devnet Smoke

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

concurrency:
  group: devnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devnet-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FOUNDRY_VERSION: v1.8.1
      RUST_TOOLCHAIN: 1.90.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq pkg-config libssl-dev

      - name: Start Anvil
        run: ./scripts/start-local-anvil.sh > /tmp/anvil.log 2>&1 &

      - name: Wait for RPC
        timeout-minutes: 1
        run: |
          for _ in {1..30}; do
            if curl -sf http://localhost:8545 -X POST \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Anvil failed to start"
          tail -n 200 /tmp/anvil.log || true
          exit 1

      - name: Validate config
        timeout-minutes: 2
        run: ./scripts/dev.sh validate

      - name: Contract tests
        timeout-minutes: 25
        run: ./scripts/dev.sh test

      - name: Smoke test
        timeout-minutes: 5
        run: ./scripts/dev.sh smoke

      - name: Anchor smoke test
        timeout-minutes: 5
        run: ./scripts/dev.sh anchor-smoke

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devnet-logs
          path: /tmp/anvil.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          pkill -f anvil 2>/dev/null || true
          pkill -f "start-local-anvil" 2>/dev/null || true
