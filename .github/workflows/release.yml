name: Release Certification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated tag to certify
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata and CI pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve requested tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout "refs/tags/${tag}^{}"
          git submodule sync
          git submodule update --init --depth 1
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.0'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Validate release metadata and CI pins
        run: ./scripts/check-release-readiness.sh '${{ steps.release.outputs.tag }}'

      - name: Validate local readiness and merchant ledger regressions
        run: python3 -m unittest discover -s scripts/tests -v

  contracts:
    name: Contract unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve requested tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout "refs/tags/${tag}^{}"
          git submodule sync
          git submodule update --init --depth 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Test critical contract paths
        run: ./scripts/test-contract-smoke.sh

      - name: Test all non-invariant contracts
        working-directory: contracts
        run: forge test --no-match-contract '.*Invariant.*' -vvv

  invariants:
    name: Contract invariant tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve requested tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout "refs/tags/${tag}^{}"
          git submodule sync
          git submodule update --init --depth 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Test contract invariants
        working-directory: contracts
        run: forge test --match-contract '.*Invariant.*' -vvv

  rust:
    name: Rust validation and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve requested tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout "refs/tags/${tag}^{}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.90.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Foundry for Anvil integration tests
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo test --test integration -- --ignored --test-threads=1
          cargo install cargo-audit --version 0.22.0 --locked
          ./scripts/cargo-audit.sh

  sdk:
    name: SDK validation and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve requested tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout "refs/tags/${tag}^{}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.0'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Validate SDK
        working-directory: sdk
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test:coverage
          npm audit --audit-level=high

  package:
    name: Reproducible artifacts and provenance
    needs: [metadata, contracts, invariants, rust, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve requested tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout "refs/tags/${tag}^{}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.0'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Build SDK package
        working-directory: sdk
        run: |
          npm ci
          npm run build
          mkdir -p ../release
          npm pack --pack-destination ../release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.90.0

      - name: Build anchor binaries
        run: |
          cargo build --workspace --release --locked
          cp target/release/set-anchor release/set-anchor-linux-x86_64
          cp target/release/reserve-attestor release/reserve-attestor-linux-x86_64

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          artifact-name: set-${{ steps.release.outputs.tag }}.spdx.json
          output-file: release/set-${{ steps.release.outputs.tag }}.spdx.json
          upload-release-assets: false
          syft-version: v1.51.1

      - name: Generate checksums
        working-directory: release
        run: sha256sum ./* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release/*

      - name: Upload certified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: set-${{ steps.release.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
