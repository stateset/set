name: Release Certification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated tag to certify
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    name: Complete quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve requested tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout "refs/tags/${tag}^{}"
          git submodule sync
          git submodule update --init --depth 1
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.0'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Validate release metadata and CI pins
        run: ./scripts/check-release-readiness.sh '${{ steps.release.outputs.tag }}'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Test critical contract paths
        run: ./scripts/test-contract-smoke.sh

      - name: Test all contracts and invariants
        working-directory: contracts
        run: |
          forge test --no-match-contract '.*Invariant.*' -vvv
          forge test --match-contract '.*Invariant.*' -vvv

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.90.0

      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo test --test integration -- --ignored --test-threads=1
          cargo install cargo-audit --version 0.22.0 --locked
          ./scripts/cargo-audit.sh

      - name: Validate SDK
        working-directory: sdk
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test:coverage
          npm audit --audit-level=high

  package:
    name: Reproducible artifacts and provenance
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve requested tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout "refs/tags/${tag}^{}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.0'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Build SDK package
        working-directory: sdk
        run: |
          npm ci
          npm run build
          mkdir -p ../release
          npm pack --pack-destination ../release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.90.0

      - name: Build anchor binaries
        run: |
          cargo build --workspace --release --locked
          cp target/release/set-anchor release/set-anchor-linux-x86_64
          cp target/release/reserve-attestor release/reserve-attestor-linux-x86_64

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          artifact-name: set-${{ steps.release.outputs.tag }}.spdx.json
          output-file: release/set-${{ steps.release.outputs.tag }}.spdx.json
          upload-release-assets: false
          syft-version: v1.51.1

      - name: Generate checksums
        working-directory: release
        run: sha256sum ./* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release/*

      - name: Upload certified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: set-${{ steps.release.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
