name: Security Analysis

on:
  pull_request:
    paths:
      - 'contracts/**/*.sol'
      - 'anchor/**'
      - 'sdk/**'
      - 'Cargo.lock'
      - 'sdk/package-lock.json'
      - 'contracts/foundry.toml'
      - 'contracts/foundry.lock'
      - 'contracts/lib/**'
      - 'contracts/slither.config.json'
      - '.gitmodules'
      - 'scripts/dev.sh'
      - 'scripts/foundry-common.sh'
      - 'scripts/test-contract-smoke.sh'
      - 'scripts/test-contract-coverage.sh'
      - '.github/workflows/security.yml'
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
    paths:
      - 'contracts/**/*.sol'
      - 'anchor/**'
      - 'sdk/**'
      - 'Cargo.lock'
      - 'sdk/package-lock.json'
      - 'contracts/foundry.toml'
      - 'contracts/foundry.lock'
      - 'contracts/lib/**'
      - 'contracts/slither.config.json'
      - '.gitmodules'
      - 'scripts/dev.sh'
      - 'scripts/foundry-common.sh'
      - 'scripts/test-contract-smoke.sh'
      - 'scripts/test-contract-coverage.sh'
      - '.github/workflows/security.yml'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slither:
    name: Slither Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Run Slither
        uses: crytic/slither-action@f197989dea5b53e986d0f88c60a034ddd77ec9a8 # v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: high
          sarif: results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: ${{ always() && hashFiles('results.sarif') != '' }}
        with:
          sarif_file: results.sarif

  forge-tests:
    name: Forge Unit and Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Run tests
        working-directory: contracts
        run: forge test --no-match-contract '.*Invariant.*' -vvv

  forge-invariants:
    name: Forge Invariant Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Run invariant tests
        working-directory: contracts
        run: forge test --match-contract '.*Invariant.*' -vvv

  forge-gas-report:
    name: Forge Gas Report
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Gas report
        working-directory: contracts
        run: forge test --no-match-contract '.*Invariant.*' --gas-report

  coverage:
    name: Test Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Run coverage
        run: ./scripts/test-contract-coverage.sh

      - name: Upload lcov reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-coverage
          path: contracts/coverage-reports/*.lcov
          if-no-files-found: error

  rust-tests:
    name: Rust Anchor Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.90.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Foundry for Anvil integration tests
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Run unit and integration tests
        run: cargo test --workspace

      - name: Run Anvil integration tests
        run: cargo test --test integration -- --ignored --test-threads=1

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Lint SDK
        working-directory: sdk
        run: npm run lint

      - name: Run tests
        working-directory: sdk
        run: npm test

      - name: Run tests with coverage
        working-directory: sdk
        run: npm run test:coverage

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.90.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Audit Rust dependencies
        run: ./scripts/cargo-audit.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.0'

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Audit npm dependencies
        working-directory: sdk
        run: npm audit --audit-level=high
