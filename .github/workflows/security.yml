name: Security Analysis

on:
  pull_request:
    paths:
      - 'contracts/**/*.sol'
      - 'anchor/**'
      - 'sdk/**'
      - 'Cargo.lock'
      - 'sdk/package-lock.json'
      - 'contracts/foundry.toml'
      - 'scripts/foundry-common.sh'
      - 'scripts/test-contract-smoke.sh'
      - '.github/workflows/security.yml'
  push:
    branches:
      - main
    paths:
      - 'contracts/**/*.sol'
      - 'anchor/**'
      - 'sdk/**'
      - 'Cargo.lock'
      - 'sdk/package-lock.json'
      - 'contracts/foundry.toml'
      - 'scripts/foundry-common.sh'
      - 'scripts/test-contract-smoke.sh'
      - '.github/workflows/security.yml'
  workflow_dispatch:

jobs:
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-2024-05-20

      - name: Install upgradeable contracts
        working-directory: contracts
        run: forge install OpenZeppelin/openzeppelin-contracts-upgradeable@625fb3c2b2696f1747ba2e72d1e1113066e6c177 --no-commit

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: high
          sarif: results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  forge-tests:
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-2024-05-20

      - name: Install upgradeable contracts
        working-directory: contracts
        run: forge install OpenZeppelin/openzeppelin-contracts-upgradeable@625fb3c2b2696f1747ba2e72d1e1113066e6c177 --no-commit

      - name: Run critical contract smoke suites
        run: ./scripts/test-contract-smoke.sh

      - name: Run tests
        working-directory: contracts
        run: forge test --no-match-contract '.*Invariant.*' -vvv

      - name: Run invariant tests
        working-directory: contracts
        run: forge test --match-contract '.*Invariant.*' -vvv

      - name: Gas report
        working-directory: contracts
        run: forge test --no-match-contract '.*Invariant.*' --gas-report

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-2024-05-20

      - name: Install upgradeable contracts
        working-directory: contracts
        run: forge install OpenZeppelin/openzeppelin-contracts-upgradeable@625fb3c2b2696f1747ba2e72d1e1113066e6c177 --no-commit

      - name: Run coverage
        working-directory: contracts
        run: forge coverage --report summary

      - name: Generate lcov report
        working-directory: contracts
        run: forge coverage --report lcov

  rust-tests:
    name: Rust Anchor Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            anchor/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run unit tests
        working-directory: anchor
        run: cargo test --lib

      - name: Run clippy
        working-directory: anchor
        run: cargo clippy -- -D warnings

      - name: Check formatting
        working-directory: anchor
        run: cargo fmt -- --check

  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Lint SDK
        working-directory: sdk
        run: npm run lint

      - name: Run tests
        working-directory: sdk
        run: npm test

      - name: Run tests with coverage
        working-directory: sdk
        run: npm run test:coverage

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Audit Rust dependencies
        working-directory: anchor
        run: cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Audit npm dependencies
        working-directory: sdk
        run: npm audit --audit-level=high
